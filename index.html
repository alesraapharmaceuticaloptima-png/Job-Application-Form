<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>طلب توظيف | Job Application — Alesraa Pharmaceuticals Optima</title>
<style>
:root{--bg:#e9eaec;--card:#f6f6f7;--ink:#2b2b30;--mut:#6c6c74;--m:#7a1f2b;--m2:#5c1520;--ln:#c9cacf}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Tahoma,"Segoe UI",Arial,sans-serif}
header{background:var(--m);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:14px}
header img{width:72px;height:72px;border-radius:8px;background:#fff;object-fit:contain}
header h1{margin:0;font-size:1.25rem}header p{margin:2px 0 0;opacity:.8;font-size:.85rem}
#lang{margin-inline-start:auto;background:#fff;color:var(--m);border:0;border-radius:6px;padding:8px 14px;font-weight:700;cursor:pointer}
main{max-width:900px;margin:18px auto;padding:0 12px}
section{background:var(--card);border:1px solid var(--ln);border-inline-start:5px solid var(--m);border-radius:8px;padding:14px 16px;margin-bottom:14px}
h2{margin:0 0 10px;color:var(--m);font-size:1.05rem}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px 14px}
.f{display:flex;flex-direction:column;gap:3px;font-size:.88rem;color:var(--mut)}
.f[hidden]{display:none}.w{grid-column:1/-1}
input,select,textarea{font:inherit;color:var(--ink);padding:9px;border:1px solid var(--ln);border-radius:6px;background:#fff;width:100%}
input[readonly]{background:#ececee}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--m);outline-offset:1px}
.note{font-size:.82rem;color:var(--m);min-height:1.2em}.note.ok{color:#2d6a3e}
.sub{grid-column:1/-1;margin:6px 0 0;font-weight:700;color:var(--m2);font-size:.9rem}
.err input,.err select,.err textarea{border-color:#c00;background:#fff1f1}.err>span:first-child{color:#c00;font-weight:700}
.s2{background:#fff;color:var(--m);border:1px solid var(--m);border-radius:6px;padding:7px 14px;font:inherit;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 30px}
.bar button{background:var(--m);color:#fff;border:0;border-radius:6px;padding:12px 22px;font:700 1rem inherit;cursor:pointer}
.bar button.s{background:#fff;color:var(--m);border:1px solid var(--m)}
#msg{margin:0 0 30px;font-weight:700}
#rep{display:none}
@media print{body>*:not(#rep){display:none!important}#rep{display:block!important;padding:10px}}
#rep table{width:100%;border-collapse:collapse;font-size:12px}#rep td,#rep th{border:1px solid #999;padding:4px 6px;text-align:start}
#rep th{background:#e9eaec;width:38%}#rep h3{color:#7a1f2b}
</style></head><body>
